services:
  - type: web
    runtime: node
    name: emaap-backend
    buildCommand: pnpm install --frozen-lockfile && pnpm run build:server
    startCommand: pnpm start
    healthCheckPath: /api/ping
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: FRONTEND_URL
        sync: false
      - key: PUBLIC_BACKEND_URL
        sync: false
